<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A-Z Square Grid - Consistent Lines</title>
    <style>
        * { box-sizing: border-box; }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-container {
            width: 210mm;
            height: 297mm;
            padding: 10mm;
            background: white;
            display: flex;
            flex-direction: column;
        }

        .grid-main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(7, 1fr);
            /* Thick outside border */
            border: 3pt solid black;
            /* Prevents double-lines and helps with rounding errors */
            overflow: hidden; 
        }

        .box {
            /* We use a standard width for all inside borders */
            border: 0.75pt solid black;
            position: relative;
            /* Negative margin makes borders overlap perfectly so they don't look thick or thin */
            margin-right: -0.75pt;
            margin-bottom: -0.75pt;
        }

        .label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 12pt;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        @media print {
            body { background: none; }
            .page-container {
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: 100vh;
                padding: 8mm; 
            }
            @page { margin: 0; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="grid-main" id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        
        alphabet.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'box';
            div.innerHTML = `<span class="label">${letter}</span>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
