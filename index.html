<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edge-to-Edge A-Z Grid</title>
    <style>
        /* 1. Absolute Reset */
        * { 
            box-sizing: border-box; 
            -webkit-print-color-adjust: exact; 
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: white;
        }

        /* 2. The Container fills the entire viewport */
        .page-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        /* 3. The Grid fills the container exactly */
        .grid-main {
            display: grid;
            flex: 1; 
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(7, 1fr);
            /* This border sits at the absolute edge of the paper */
            border: 4pt solid black; 
        }

        .box {
            border: 1pt solid black;
            position: relative;
            margin-right: -1pt;
            margin-bottom: -1pt;
        }

        .label {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 10pt;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        /* 4. Critical Print Rules */
        @media print {
            @page {
                margin: 0; 
                size: auto;
            }
            body {
                margin: 0;
            }
            .page-wrapper {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <div class="grid-main" id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        
        alphabet.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'box';
            div.innerHTML = `<span class="label">${letter}</span>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
