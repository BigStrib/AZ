<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A-Z Grid Fixed</title>
    <style>
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            /* Prevents the browser from adding extra scrolling space */
            overflow: hidden; 
        }

        .page-container {
            width: 210mm;
            /* Changed to 296mm (1mm shorter than A4) to prevent the "ghost" second page */
            height: 296mm; 
            padding: 10mm;
            background: white;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .grid-main {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            /* Using 7 rows to keep the 4x7 square shape */
            grid-template-rows: repeat(7, 1fr);
            border: 3pt solid black;
            overflow: hidden;
        }

        .box {
            border: 0.75pt solid black;
            position: relative;
            /* Overlap borders to prevent "double lines" */
            margin-right: -0.75pt;
            margin-bottom: -0.75pt;
        }

        .label {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 12pt;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        @media print {
            body { background: none; }
            .page-container {
                width: 100vw;
                /* calc(100vh - 1mm) ensures we never trigger a second page */
                height: calc(100vh - 1mm);
                padding: 8mm;
                box-shadow: none;
            }
            @page {
                margin: 0;
                size: auto;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="grid-main" id="grid"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
        
        alphabet.forEach(letter => {
            const div = document.createElement('div');
            div.className = 'box';
            div.innerHTML = `<span class="label">${letter}</span>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
